[project]
name = "governed-agentic-commerce"
version = "0.1.0"
description = "Governed agentic commerce platform: agents propose, deterministic systems authorize and execute."
requires-python = ">=3.14"
dependencies = [
    "reserve-trust",
    "reserve-signer",
    "commerce-domain",
    "platform-db",
    "transaction-kernel",
    "durable-work",
    "merchant-sim",
    "payment-adapters",
    "commerce-api",
    "commerce-protocols",
    "action-executor",
    "agent-runtime",
    "voice-runtime",
    "platform-observability",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
reserve-trust = { workspace = true }
reserve-signer = { workspace = true }
commerce-domain = { workspace = true }
platform-db = { workspace = true }
transaction-kernel = { workspace = true }
durable-work = { workspace = true }
merchant-sim = { workspace = true }
merchant-adapter = { workspace = true }
merchant-controller = { workspace = true }
payment-adapters = { workspace = true }
commerce-api = { workspace = true }
commerce-protocols = { workspace = true }
action-executor = { workspace = true }
agent-runtime = { workspace = true }
voice-runtime = { workspace = true }
# Specification 15.1 pins AP2 to a commit, not a tag or a branch: no PyPI package is
# published for it, and `main` moves. The pinned tree is the only thing the conformance
# vectors in commerce-protocols are meaningful against.
ap2 = { git = "https://github.com/google-agentic-commerce/AP2.git", rev = "b4587ac1d055888a73b4b21750973cffba961793" }
platform-observability = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "rfc8785>=0.1.4,<1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Alembic writes these; they are reviewed as migrations, not maintained as source.
extend-exclude = ["packages/platform-db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "RET", "SIM", "ARG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately nest `with pytest.raises(...)` around a transaction block so the
# assertion covers commit-time failures such as RLS WITH CHECK violations.
"**/tests/**" = ["SIM117", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --strict-markers"
markers = [
    "db: needs a reachable PostgreSQL with migrations applied and test roles bootstrapped",
    "e2e: drives the API and an in-process executor through a whole journey",
    "razorpay_live: calls Razorpay test mode over the network; needs RAZORPAY_* in the environment",
    "slow: takes more than a few seconds",
    "voice_live: drives real speech through Gemini Transcribe Live and the running API; needs Vertex ADC and GOOGLE_CLOUD_PROJECT",
]

[tool.mypy]
python_version = "3.14"
strict = true

# AP2 ships no `py.typed` marker and is a PEP 420 namespace package, so strict mypy cannot
# see through it. The pin is a specification requirement (15.1) and the package is not ours
# to fix, so its types are taken on trust at exactly this boundary and nowhere else:
# `commerce_protocols.ap2` wraps every AP2 call in a typed function of its own, which is
# what the rest of the codebase is allowed to see.
[[tool.mypy.overrides]]
module = ["ap2.*", "jwcrypto.*"]
ignore_missing_imports = true
