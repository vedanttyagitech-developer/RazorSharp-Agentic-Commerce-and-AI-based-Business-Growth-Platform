# Image references, shared by the workload overlay and the db-migrate overlay so both
# always roll the same tag. Change newTag here (or: kustomize edit set image ...).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: commerce-api
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/commerce/commerce-api
    newTag: demo
  - name: durable-worker
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/commerce/durable-worker
    newTag: demo
  - name: buyer-web
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/commerce/buyer-web
    newTag: demo
  - name: merchant-console
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/commerce/merchant-console
    newTag: demo
