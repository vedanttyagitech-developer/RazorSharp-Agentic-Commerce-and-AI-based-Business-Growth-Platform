# dev overlay: kubectl apply -k infra/kubernetes/overlays/dev
# Run the migration first: kubectl apply -k infra/kubernetes/overlays/dev/db-migrate
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commerce
resources:
  - platform
  - ../../base/workloads
components:
  - images
patches:
  - target: { kind: Ingress, name: commerce }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.commerce.example.com
      - op: add
        path: /metadata/annotations/kubernetes.io~1ingress.global-static-ip-name
        value: commerce-dev-ingress
  - target: { kind: ManagedCertificate, name: commerce }
    patch: |-
      - op: replace
        path: /spec/domains/0
        value: dev.commerce.example.com
  - target: { kind: FrontendConfig, name: commerce }
    patch: |-
      - op: replace
        path: /spec/sslPolicy
        value: commerce-dev-tls-modern
  # The executor's liveness probe is live; this opt-out is kept only as the shape of a
  # patch, should a future environment need to disable it:
  # - target: { kind: Deployment, name: action-executor }
  #   patch: |-
  #     - op: remove
  #       path: /spec/template/spec/containers/0/livenessProbe
