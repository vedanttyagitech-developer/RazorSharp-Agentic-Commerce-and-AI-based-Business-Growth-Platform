# Workload Identity Federation for GKE: KSA commerce/<name> -> GSA <name>@PROJECT_ID.
# The IAM side (roles/iam.workloadIdentityUser) is created by infra/terraform/iam.tf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commerce-api
  annotations:
    iam.gke.io/gcp-service-account: commerce-api@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: action-executor
  annotations:
    iam.gke.io/gcp-service-account: action-executor@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buyer-web
  annotations:
    iam.gke.io/gcp-service-account: buyer-web@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migration
  annotations:
    iam.gke.io/gcp-service-account: db-migration@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: merchant-console
  annotations:
    iam.gke.io/gcp-service-account: merchant-console@PROJECT_ID.iam.gserviceaccount.com
