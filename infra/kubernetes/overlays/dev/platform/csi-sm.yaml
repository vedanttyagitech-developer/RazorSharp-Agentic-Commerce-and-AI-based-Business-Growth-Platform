# Secret Manager -> files, through the GKE Secret Manager add-on (CSI driver
# secrets-store-gke.csi.k8s.io). Each `path` is the environment variable the file becomes
# (infra/docker/entrypoint.py). The add-on cannot sync secrets into env vars itself.
# Access: roles/secretmanager.secretAccessor per secret, per workload (infra/terraform/sm.tf).
# File name avoids the word "secret" because the root .gitignore ignores *secret*.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: commerce-api
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/razorpay-key-id/versions/latest"
        path: "RAZORPAY_KEY_ID"
      - resourceName: "projects/PROJECT_ID/secrets/razorpay-key-secret/versions/latest"
        path: "RAZORPAY_KEY_SECRET"
      - resourceName: "projects/PROJECT_ID/secrets/razorpay-webhook-secret/versions/latest"
        path: "RAZORPAY_WEBHOOK_SECRET"
      - resourceName: "projects/PROJECT_ID/secrets/db-url-app/versions/latest"
        path: "DATABASE_URL_APP"
      - resourceName: "projects/PROJECT_ID/secrets/db-url-kernel/versions/latest"
        path: "DATABASE_URL_KERNEL"
      - resourceName: "projects/PROJECT_ID/secrets/gemini-api-key/versions/latest"
        path: "GEMINI_API_KEY"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: durable-worker
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/razorpay-key-id/versions/latest"
        path: "RAZORPAY_KEY_ID"
      - resourceName: "projects/PROJECT_ID/secrets/razorpay-key-secret/versions/latest"
        path: "RAZORPAY_KEY_SECRET"
      - resourceName: "projects/PROJECT_ID/secrets/db-url-worker/versions/latest"
        path: "DATABASE_URL_WORKER"
      - resourceName: "projects/PROJECT_ID/secrets/db-url-kernel/versions/latest"
        path: "DATABASE_URL_KERNEL"
