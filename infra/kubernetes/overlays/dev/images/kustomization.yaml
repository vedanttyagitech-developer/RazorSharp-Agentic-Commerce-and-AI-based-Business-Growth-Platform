# Image references, shared by the workload overlay and the db-migrate overlay so both
# always roll the same tag. Change newTag here (or: kustomize edit set image ...).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: commerce-api
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/commerce/commerce-api
    newTag: dev
  - name: action-executor
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/commerce/action-executor
    newTag: dev
