# One Kubernetes ServiceAccount per workload (spec 23.1). The overlays add the Workload
# Identity annotation (iam.gke.io/gcp-service-account) because it carries the project id.
# None of the workloads talk to the Kubernetes API, so the token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commerce-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: durable-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buyer-web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migration
automountServiceAccountToken: false
