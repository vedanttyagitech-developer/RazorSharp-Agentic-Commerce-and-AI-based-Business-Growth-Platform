# One Kubernetes ServiceAccount per workload (spec 23.1). The overlays add the Workload
# Identity annotation (iam.gke.io/gcp-service-account) because it carries the project id.
# None of the workloads talk to the Kubernetes API, so the token is not mounted.
#
# The two web identities left with the front end on 2026-09-09. They were separate from
# each other on purpose -- the console could read the scenario key and the operator
# cookie secret and the storefront could not -- and a front end that returns should get
# its own identity rather than borrowing the API's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commerce-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: action-executor
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migration
automountServiceAccountToken: false
