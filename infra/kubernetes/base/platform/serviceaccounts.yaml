# One Kubernetes ServiceAccount per workload (spec 23.1). The overlays add the Workload
# Identity annotation (iam.gke.io/gcp-service-account) because it carries the project id.
# None of the workloads talk to the Kubernetes API, so the token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commerce-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: durable-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buyer-web
automountServiceAccountToken: false
---
# The console's identity is separate from the storefront's because their Secret Manager
# grants differ: this one may read the scenario key and the operator cookie secret, and
# buyer-web may not. One shared web identity would give the storefront the console's
# credentials (infra/terraform/sm.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: merchant-console
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migration
automountServiceAccountToken: false
