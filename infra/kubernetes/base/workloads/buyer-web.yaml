# buyer-web: Next.js standalone server on distroless Node (UID 65532). Stateless, so it
# rolls with zero downtime. It talks to the API only through its own route handlers
# (API_BASE, in-cluster); the browser never receives a Google or Razorpay credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buyer-web
  labels:
    app.kubernetes.io/name: buyer-web
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: buyer-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buyer-web
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: buyer-web
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: buyer-web
          env:
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: "0.0.0.0" }
            - { name: NODE_ENV, value: production }
            - { name: NEXT_TELEMETRY_DISABLED, value: "1" }
            - { name: NEXT_PUBLIC_API_MODE, value: live }
            # Server-only upstream for the route handlers (apps/buyer-web/src/lib/server/env.ts).
            - { name: API_BASE, value: http://commerce-api.commerce.svc.cluster.local:8000 }
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: next-cache
          emptyDir: { sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: buyer-web
  labels:
    app.kubernetes.io/name: buyer-web
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "buyer-web"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buyer-web
  ports:
    - { name: http, port: 3000, targetPort: http, protocol: TCP }
---
# The browser's EventSource for /v1/checkouts/{id}/events is proxied by the Next.js route
# handler (/api/backend/...), so this backend needs the long timeout as well.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: buyer-web
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /
    port: 3000
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
  logging:
    enable: true
    sampleRate: 0.5
