# Disruption budgets (spec 23.1). The API is demo-critical and runs one replica, so a
# voluntary disruption (node upgrade, drain) is blocked; GKE Autopilot waits up to 60
# minutes before overriding. The worker may be disrupted: outbox leases expire (60 s) and
# the next worker resumes.
#
# The two web budgets left with the front end on 2026-09-09.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: commerce-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: commerce-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: action-executor
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: action-executor
