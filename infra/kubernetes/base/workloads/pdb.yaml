# Disruption budgets (spec 23.1). The API and the web front end are demo-critical and
# run one replica each, so a voluntary disruption (node upgrade, drain) is blocked; GKE
# Autopilot waits up to 60 minutes before overriding. The worker may be disrupted: outbox
# leases expire (60 s) and the next worker resumes.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: commerce-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: commerce-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: buyer-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buyer-web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: durable-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: durable-worker
