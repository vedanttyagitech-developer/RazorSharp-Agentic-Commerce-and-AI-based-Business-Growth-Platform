# One controlled edge (spec 22.1): global external Application Load Balancer through the
# GKE Ingress controller, Google-managed certificate, HTTP->HTTPS redirect. The overlay
# sets the host, the static IP name, the certificate domain and the SSL policy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commerce
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: "true" # the HTTP frontend exists only to redirect
    networking.gke.io/managed-certificates: commerce
    networking.gke.io/v1beta1.FrontendConfig: commerce
spec:
  rules:
    - host: SET-BY-OVERLAY.example.com
      http:
        paths:
          - path: /healthz
            pathType: ImplementationSpecific
            backend:
              service: { name: commerce-api, port: { number: 8000 } }
          - path: /v1/*
            pathType: ImplementationSpecific
            backend:
              service: { name: commerce-api, port: { number: 8000 } }
          - path: /webhooks/*
            pathType: ImplementationSpecific
            backend:
              service: { name: commerce-api, port: { number: 8000 } }
          # Everything else is the API too, now that there is no front end behind this
          # edge. This catch-all used to be the storefront, which meant `/acp/*`, `/mcp`
          # and `/.well-known/*` -- the protocol surfaces external agents actually call --
          # were being handed to a Next process that has no route for them.
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service: { name: commerce-api, port: { number: 8000 } }
    # A console, if one returns, belongs on its own host and never on a path under the
    # storefront's. The reason is blast radius: a path prefix puts it on the same origin
    # as the buyer app, so its cookies and any XSS in either reach the other -- and the
    # console is where a session can revive an outbox command or throw the Safe Mode
    # switch. A separate host also makes "who can reach the console" an edge-level
    # question (Cloud Armor, or simply not publishing the DNS record) rather than one
    # buried in a routing table. The rule is gone with the app; the reasoning is not.
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: commerce
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
  # google_compute_ssl_policy from Terraform (TLS 1.2+, MODERN profile).
  sslPolicy: SET-BY-OVERLAY
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: commerce
spec:
  domains:
    # One host. The second was the console's and left with it on 2026-09-09; a
    # certificate naming a domain nothing serves fails provisioning rather than
    # sitting harmlessly unused.
    - SET-BY-OVERLAY.example.com
