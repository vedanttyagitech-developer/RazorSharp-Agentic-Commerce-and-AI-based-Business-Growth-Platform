[project]
name = "commerce-api"
version = "0.1.0"
description = "FastAPI modular monolith: trusted buyer surface, protocol-neutral commerce API, evidence endpoints."
requires-python = ">=3.14"
dependencies = [
    "commerce-domain",
    "platform-db",
    "transaction-kernel",
    "durable-work",
    "merchant-sim",
    "payment-adapters",
    "commerce-protocols",
    "agent-runtime",
    "platform-observability",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
    "sse-starlette>=3.4",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_api"]
