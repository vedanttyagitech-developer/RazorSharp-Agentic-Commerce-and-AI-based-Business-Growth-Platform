[project]
name = "transaction-kernel"
version = "0.1.0"
description = "The only component that may authorize money movement."
requires-python = ">=3.14"
dependencies = ["commerce-domain", "platform-db", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transaction_kernel"]
