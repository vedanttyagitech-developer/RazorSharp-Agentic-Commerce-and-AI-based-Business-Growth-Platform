[project]
name = "commerce-protocols"
version = "0.1.0"
description = "Protocol adapters -- UCP, AP2, ACP, MCP -- onto the protocol-neutral transaction kernel."
requires-python = ">=3.14"
dependencies = [
    "commerce-domain",
    "platform-db",
    "transaction-kernel",
    "ap2",
    "pydantic>=2.12",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_protocols"]
