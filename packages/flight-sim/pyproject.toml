[project]
name = "flight-sim"
version = "0.1.0"
description = "Deterministic airline merchant: schedule, fare families, seat inventory and fare-change injections."
requires-python = ">=3.14"
dependencies = ["commerce-domain", "transaction-kernel", "merchant-sim"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_sim"]
