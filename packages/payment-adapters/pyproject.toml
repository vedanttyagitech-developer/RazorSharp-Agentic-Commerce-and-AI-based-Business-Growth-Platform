[project]
name = "payment-adapters"
version = "0.1.0"
description = "Provider adapters. Deterministic request building, verification and outcome classification."
requires-python = ">=3.14"
# Deliberately no HTTP library and no database driver. The transport is injected by the
# caller, so this package is testable without a network and importable without a pool.
dependencies = ["commerce-domain", "transaction-kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_adapters"]
