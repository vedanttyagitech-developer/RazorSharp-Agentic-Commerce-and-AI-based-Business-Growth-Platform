[project]
name = "voice-runtime"
version = "0.1.0"
description = "Split-pipeline realtime voice: Transcribe Live STT session, deterministic transactional speech, wire contract."
requires-python = ">=3.14"
dependencies = [
    "commerce-domain",
    "transaction-kernel",
    "pydantic>=2.12",
    "fastapi>=0.141",
    "httpx>=0.28",
    "uvicorn[standard]>=0.52",
    "google-genai>=2.22",
    "google-cloud-texttospeech>=2.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_runtime"]
