[project]
name = "voice-runtime"
version = "0.1.0"
description = "Conversational state machine, grounded speech safeguards and explicit GCP streaming adapters."
requires-python = ">=3.14"
dependencies = [
    "commerce-domain",
    "pydantic>=2.12",
    "fastapi>=0.141",
    "httpx>=0.28",
    "uvicorn[standard]>=0.52",
    "google-cloud-texttospeech>=2.34",
    "google-genai>=2.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_runtime"]
