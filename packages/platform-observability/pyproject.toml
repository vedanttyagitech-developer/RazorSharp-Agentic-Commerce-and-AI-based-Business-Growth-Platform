[project]
name = "platform-observability"
version = "0.1.0"
description = "Operational telemetry: a metrics registry, redacting structured logs, correlation and span timing. Depends on nothing, so it can never be on the path that decides whether money moves."
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_observability"]
