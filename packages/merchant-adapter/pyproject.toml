[project]
name = "merchant-adapter"
version = "0.1.0"
description = "The merchant simulator as the kernel sees it: state source, checkout content, receipt inputs."
requires-python = ">=3.14"
dependencies = ["commerce-domain", "merchant-sim", "transaction-kernel", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merchant_adapter"]
