[project]
name = "durable-work"
version = "0.1.0"
description = "Transactional outbox and work leasing. Makes a committed command recoverable."
requires-python = ">=3.14"
dependencies = ["commerce-domain", "platform-db", "transaction-kernel", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_work"]
