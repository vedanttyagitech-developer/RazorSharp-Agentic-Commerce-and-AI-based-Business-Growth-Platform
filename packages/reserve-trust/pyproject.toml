[project]
name = "reserve-trust"
version = "0.1.0"
description = "Public-key trust policy for the Reserve simulator; no application or signing dependencies."
requires-python = ">=3.14"
dependencies = ["jwcrypto>=1.5.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/reserve_trust"]
