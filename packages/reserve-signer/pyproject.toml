[project]
name = "reserve-signer"
version = "0.1.0"
description = "Isolated KMS-backed simulator issuer with independently configured admission bounds."
requires-python = ">=3.14"
dependencies = ["reserve-trust", "fastapi>=0.141", "uvicorn>=0.52", "google-auth[requests]>=2.57", "requests>=2.32", "cryptography>=46", "rfc8785>=0.1.4,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/reserve_signer"]
