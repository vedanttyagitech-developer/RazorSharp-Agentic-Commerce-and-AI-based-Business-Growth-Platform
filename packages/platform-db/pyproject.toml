[project]
name = "platform-db"
version = "0.1.0"
description = "Schema, tenant isolation and database roles. Financial writes belong to the kernel."
requires-python = ">=3.14"
dependencies = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.13", "commerce-domain"]

[dependency-groups]
dev = ["transaction-kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_db"]
