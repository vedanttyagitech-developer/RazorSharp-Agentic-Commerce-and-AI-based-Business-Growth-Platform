[project]
name = "merchant-sim"
version = "0.1.0"
description = "Deterministic merchant connector stand-in: catalogue, inventory, price, fees, fulfilment."
requires-python = ">=3.14"
dependencies = ["commerce-domain", "transaction-kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merchant_sim"]
